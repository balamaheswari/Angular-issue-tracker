<div class="profile-page">

  <h1>Profile</h1>
  <p>View your account information.</p>

  <div class="profile-card">

    <div class="profile-row">
      <span>Name</span>
      <strong>{{ user?.name }}</strong>
    </div>

    <div class="profile-row">
      <span>Email</span>
      <strong>{{ user?.email }}</strong>
    </div>

    <div class="profile-row">
      <span>Role</span>
      <strong>{{ user?.role }}</strong>
    </div>

  </div>

</div>
