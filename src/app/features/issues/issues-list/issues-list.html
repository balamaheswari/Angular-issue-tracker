<div class="issues-page">

  <div class="page-header">
    <div>
      <h1>Issues</h1>
      <p>Manage and track project issues</p>
    </div>

    <button class="create-button" routerLink="/issues/create">
      + Create Issue
    </button>
  </div>

  <div class="issues-table">

    <div class="table-header">
      <span>Title</span>
      <span>Priority</span>
      <span>Status</span>
      <span>Assignee</span>
      <span>Action</span>
    </div>

    @for (issue of issues(); track issue.id) {
      <div class="table-row">
        <span class="issue-title">{{ issue.title }}</span>
        <span>{{ issue.priority }}</span>
        <span>{{ issue.status }}</span>
        <span>{{ issue.assignee }}</span>

       <div class="action-buttons">
  <a
    class="edit-button"
    [routerLink]="['/issues/edit', issue.id]"
  >
    Edit
  </a>

  <button
    class="delete-button"
    (click)="deleteIssue(issue.id)"
  >
    Delete
  </button>
</div>
      </div>
    }

  </div>

</div>
